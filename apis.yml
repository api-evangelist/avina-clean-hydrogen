name: Avina Clean Hydrogen

description: Avina Clean Hydrogen, part of Avina Inc., develops and delivers cutting‑edge clean energy solutions, focusing on low‑carbon ammonia,
  synthetic aviation fuel, and especially clean hydrogen produced via renewable electrolysis. The company aims to accelerate the global transition
  to clean fuels for heavy transport, shipping, steel and chemicals, with commercial plants slated for operation from 2025. Avina’s mission is
  to provide affordable, reliable clean energy, scaling next‑generation fuels worldwide.

